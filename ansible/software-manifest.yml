#   Microsoft Teams Meeting Add-in for Microsoft Office    23/24
#   Dell SupportAssist                                     19/24
#   Dell SupportAssist OS Recovery Plugin for Dell Update  17/24
#   Printer Installer Client (NSCC's print client - likely obsolete now)  18/24
#   Microsoft .NET runtime 8.0.31 family                   19/24  (only if something needs it)
#   Microsoft .NET runtime 10.0.12 family                  16/24  (only if something needs it)
#   Microsoft OneDrive   (machine-wide install; version tracks Microsoft's updates)
