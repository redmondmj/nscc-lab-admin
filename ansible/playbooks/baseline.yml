---
# Baseline config for a liberated lab machine. Idempotent - safe to re-run
# any time (including after a FOG reimage + Bootstrap-WinRM-Ansible.ps1).
#
#   ansible-playbook playbooks/baseline.yml --ask-vault-pass
#
- name: Lab baseline configuration
  hosts: windows_lab
  gather_facts: true
  tasks:
    - name: Ensure ansible-ops account is in Administrators
      ansible.windows.win_group_membership:
        name: Administrators
        members:
          - "{{ ansible_user }}"
        state: present

    - name: Confirm only the HTTPS WinRM listener exists (no plaintext HTTP)
      ansible.windows.win_shell: |
        (Get-ChildItem WSMan:\localhost\Listener | Where-Object { $_.Keys -contains "Transport=HTTP" }).Count
      register: http_listeners
      changed_when: false
      failed_when: http_listeners.stdout | trim | int > 0

    # Windows Update is owned by the Intune update ring, not this playbook.
    # This task used to force notify-only through the legacy policy key,
    # which contradicts the ring's "auto install" and can override it, so
    # the value is removed outright (not merely no longer set) to clear it
    # from the machines that already received it.
    - name: Remove the old notify-only Windows Update value (Intune update ring owns this now)
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU
        name: AUOptions
        state: absent

    - name: Never sleep on AC power (a sleeping machine looks identical to a
        dead one over WinRM - "No route to host" either way - and costs a
        physical walk to tell the difference)
      ansible.windows.win_shell: powercfg /change standby-timeout-ac 0
      changed_when: true

    - name: Never turn off the display on AC power either (screen-off still
        looks awake to WinRM, but reads as "broken" to whoever's using it)
      ansible.windows.win_shell: powercfg /change monitor-timeout-ac 0
      changed_when: true

    # UAC: keep standard-user elevation at "prompt for credentials" (3).
    # Make Me Admin depends on it: it adds the student to Administrators,
    # but their current session is still a standard token, so elevating
    # goes through this setting. Value 0 ("automatically deny") blocked
    # elevation on LAB312-07 and -20 on 2026-09-21 with a "blocked by group
    # policy" message. Nothing in this repo sets it and it is not delivered
    # by Intune, so the cause is unknown. IMPORTANT: after the first run,
    # a "changed" result on this task means something set it again - treat
    # that as a signal to investigate, not just a routine correction.
    - name: Keep standard-user UAC elevation at "prompt for credentials" (Make Me Admin depends on it)
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
        name: ConsentPromptBehaviorUser
        data: 3
        type: dword

    # Tripwire, deliberately last so a failure here doesn't skip the tasks
    # above for that machine. Make Me Admin has vanished from machines
    # before with no confirmed cause; this makes the next occurrence show
    # up in the recap instead of in a student's bug report.
    - name: Check Make Me Admin is present
      ansible.windows.win_shell: "[bool](Get-Service | Where-Object { $_.Name -like '*MakeMe*' })"
      register: mma_present
      changed_when: false

    - name: Flag machines that have lost Make Me Admin
      ansible.builtin.fail:
        msg: >-
          Make Me Admin is missing on {{ inventory_hostname }}. Reinstall
          with push-software.yml (see README Troubleshooting).
      when: mma_present.stdout | trim != 'True'

    # Extend below as coursework needs - e.g. baseline tooling installs,
    # local firewall logging, event log forwarding to SecurityOnion, etc.
